name: build-and-test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RegistroDeEstudantes.Tests/RegistroDeEstudantes.Tests.csproj

      - name: Build
        run: dotnet build RegistroDeEstudantes.Tests/RegistroDeEstudantes.Tests.csproj --no-restore

      - name: Test
        run: dotnet test RegistroDeEstudantes.Tests/RegistroDeEstudantes.Tests.csproj --no-build --verbosity normal

  build-and-push-image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/student-registry:latest
